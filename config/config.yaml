analysis:
  cointegration:
    method: engle_granger
    significance_level: 0.05
  cross_mean:
    min_crossings_2y: 24
    min_crossings_per_year: 12
  hurst:
    max_hurst_exponent: 0.5
    method: rs
  tail_dependence:
    u_low: 0.05
    u_high: 0.95
    filter_enabled: true
    min_lower_tail: 0.25
    min_upper_tail: 0.15
backtesting:
  data_split:
    in_sample_pct: 0.7
    out_sample_pct: 0.3
  execution:
    execution_delay: 1
    slippage: 0.0005
data:
  cotahist_files:
  - data\COTAHIST_A2014.TXT
  - data\COTAHIST_A2015.TXT
  - data\COTAHIST_A2016.TXT
  - data\COTAHIST_A2017.TXT
  - data\COTAHIST_A2018.TXT
  - data\COTAHIST_A2019.TXT
  - data\COTAHIST_A2020.TXT
  encoding: latin-1
  input_directory: data
  output:
    decimal: ','
    directories:
      base: outputs
      cointegration: outputs/03_cointegration
      filtered_pairs: outputs/04_filtered_pairs
      final_results: outputs/05_final_results
      liquidity: outputs/01_liquidity
      price_matrix: outputs/02_price_matrix
    encoding_out: utf-8-sig
    separator: ;
  years:
  - 2014
  - 2015
  - 2016
  - 2017
  - 2018
  - 2019
  - 2020
liquidity:
  score_weights:
    consistency: 0.1
    frequency: 0.2
    trades: 0.3
    volume: 0.4
  selection:
    business_days_period: 504
    min_daily_volume: 500000
    min_trading_days: 100
    min_trading_frequency: 0.8
    top_n_stocks: 100
logging:
  file: null
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  level: INFO
  show_progress: true
performance:
  benchmark: IBOV
  metrics:
  - total_return
  - annualized_return
  - volatility
  - sharpe_ratio
  - max_drawdown
  - win_rate
  - profit_factor
  risk_free_rate: 0.1075
processing:
  memory:
    chunk_size: 10000
    use_cache: true
    use_chunks: true
  parallel:
    enabled: false
    n_cores: auto
strategy:
  position:
    initial_capital: 100000
    max_position_size: 0.05
    transaction_cost: 0.001
  zscore:
    entry_threshold: 2.5
    exit_threshold: 0.2
    lookback_window: 252
